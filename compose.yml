services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: contract_governance
      POSTGRES_USER: contract_governance
      POSTGRES_PASSWORD: ${CG_DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_governance -d contract_governance"]
      interval: 5s
      timeout: 3s
      retries: 20
  scanner:
    image: clamav/clamav:1.5.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - scanner_signatures:/var/lib/clamav
volumes:
  postgres_data:
  scanner_signatures:
