name: Backend build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, setup/backend, feature/backend-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Extract frozen canonical contracts
        run: |
          python scripts/extract_contracts.py
          git diff --exit-code -- contracts apps/api/src/main/resources/contracts
      - name: Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Package Backend (tests explicitly skipped)
        working-directory: apps/api
        run: ./mvnw -B -Dmaven.test.skip=true package
