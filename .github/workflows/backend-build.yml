name: Backend build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, setup/backend, feature/backend-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Extract frozen canonical contracts
        run: |
          python scripts/extract_contracts.py
          git diff --exit-code -- contracts apps/api/src/main/resources/contracts
      - name: Verified Oracle JDK 25.0.4.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jdk-25.0.4.1_linux-x64_bin.tar.gz"
          target="$RUNNER_TEMP/cg-oracle-jdk-25.0.4.1"
          test ! -e "$target"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://download.oracle.com/java/25/archive/jdk-25.0.4.1_linux-x64_bin.tar.gz \
            --output "$archive"
          echo "dd7e7f51d23bcffe85f1a439577ce1c0190a33417b34afdb338f9b3897bdeaec  $archive" | sha256sum --check --strict
          python - "$archive" "$target" <<'PY'
          import pathlib, sys, tarfile
          target = pathlib.Path(sys.argv[2])
          target.mkdir()
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              archive.extractall(target, filter='data')
          PY
          jdk="$target/jdk-25.0.4.1"
          "$jdk/bin/java" -version
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - name: Package Backend (tests explicitly skipped)
        working-directory: apps/api
        run: ./mvnw -B -Dmaven.test.skip=true package
