# Optional explicit local HTTPS configuration. Never loaded by the guarded launcher.
# Supply an isolated database/storage/scanner/process and private secrets before activation.
server.address=127.0.0.1
server.port=${CG_TLS_PORT:18443}
server.ssl.enabled=true
server.ssl.key-store=${CG_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${CG_TLS_KEYSTORE_PASSWORD}
server.ssl.key-alias=cg-local
server.forward-headers-strategy=none
spring.datasource.url=${CG_DATABASE_URL}
spring.datasource.username=${CG_DATABASE_USER}
spring.datasource.password=${CG_DATABASE_PASSWORD}
cg.cursor-secret=${CG_CURSOR_SECRET}
cg.storage-root=${CG_STORAGE_ROOT}
cg.scanner.host=${CG_SCANNER_HOST}
cg.scanner.port=${CG_SCANNER_PORT}
