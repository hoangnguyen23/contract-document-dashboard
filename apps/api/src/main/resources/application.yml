spring:
  application:
    name: contract-governance-api
  autoconfigure:
    # Authentication is owned by the database SessionFilter; do not create unused generated credentials.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${CG_DATABASE_URL:jdbc:postgresql://localhost:5432/contract_governance}
    username: ${CG_DATABASE_USER:contract_governance}
    password: ${CG_DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  address: ${CG_SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-cg-session
        secure: true
        http-only: true
        same-site: lax
        path: /
cg:
  storage-root: ${CG_STORAGE_ROOT:../../var/private-files}
  cursor-secret: ${CG_CURSOR_SECRET:}
  scanner:
    host: ${CG_SCANNER_HOST:localhost}
    port: ${CG_SCANNER_PORT:3310}
